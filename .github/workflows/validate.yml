name: suite-validation

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Unified v2.0.0 4ndr0neering gate (zero external dependencies):
      #   build, inventory, V8 parse, metadata/URL channels, OPSEC & 3lectric-Glass
      #   style audit, hotkey collision census, QR verify, size budget, kernel & TT smoke.
      - name: Unified v2.0.0 Check Pipeline
        run: npm run check

      - name: Declarative 4ndr0neering Contract Certification
        run: python3 scripts/4ndr0_validate.py --root . --convergence-contract contract.json --execute-checks --require-full-certification

      - name: Delivery & Test Suite Verification
        run: npm test

      - name: Live Browser Proof-of-Possession Smoke Suite
        run: npm run smoke:browser

      - name: Generated Artifact Freshness Gate
        run: test -z "$(git status --porcelain)"
